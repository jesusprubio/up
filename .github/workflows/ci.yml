name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Install dependencies
        run: make dep
      - name: Run linters
        run: make vet
      - name: Run tests
        run: make test
